[tool.ruff]
target-version = "py38"
line-length = 88
extend-exclude = ["build", "devel", "install", "log"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "N",
  "ANN",
  "D",
  "B",
  "BLE",
  "SIM",
  "C90",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
ignore = [
  # ROS Noetic uses Python 3.8; zip(strict=...) requires Python 3.10.
  "B905",
  # Use the PEP 257 convention: no blank line before a class docstring.
  "D203",
  # Keep the summary on the first line of a multi-line docstring.
  "D213",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
